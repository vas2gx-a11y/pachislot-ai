{#
  共通UIコンポーネント集。
  今後ページや機能を追加するときは、まずここに使えるマクロが無いか確認してから
  ベタ書きのHTMLを増やさないようにする(レイアウトの一貫性を保つため)。

  スタイルの土台(.card / .panel / .input / .btn など)は base.html の <style> にある。
#}

{# セクション見出し(アイコンバッジ + タイトル + 任意の件数バッジ) #}
{% macro section_header(icon, title, badge=None, icon_bg='bg-gray-100') %}
<h2 class="font-display font-bold text-lg text-gray-900 mb-3 flex items-center gap-2">
    <span class="inline-flex items-center justify-center w-8 h-8 rounded-md {{ icon_bg }} text-base shrink-0">{{ icon }}</span>
    {{ title }}
    {% if badge %}<span class="text-xs text-gray-400 font-normal font-sans">{{ badge }}</span>{% endif %}
</h2>
{% endmacro %}

{# カード内の小見出し(セクションほど大きくない、フォーム内の区切りなどに使う) #}
{% macro card_title(icon, title) %}
<h3 class="font-display font-bold text-base text-gray-900 mb-3 flex items-center gap-2">
    <span>{{ icon }}</span> {{ title }}
</h3>
{% endmacro %}

{#
  見出し付きカード。{% call card(...) %}...{% endcall %} の形で中身を書く。
  カードの余白・角丸・見出しの体裁をページ間で揃えるために使う。
#}
{% macro card(icon, title, badge=None, icon_bg='bg-gray-100', description=None) %}
<section class="card card-body">
    {% if title %}
    <h2 class="font-display font-bold text-base md:text-lg text-gray-900 flex flex-wrap items-center gap-x-2 gap-y-1">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-md {{ icon_bg }} text-base shrink-0">{{ icon }}</span>
        <span>{{ title }}</span>
        {% if badge %}<span class="text-xs text-blue-600 font-normal font-sans">{{ badge }}</span>{% endif %}
    </h2>
    {% endif %}
    {% if description %}<p class="hint mt-2">{{ description }}</p>{% endif %}
    <div class="{% if title or description %}mt-4{% endif %}">{{ caller() }}</div>
</section>
{% endmacro %}

{#
  開閉できるカード。{% call collapsible_card(...) %}...{% endcall %} で使う。
  入力フォームのように「普段は畳んでおきたいが、たまに使う」ブロック向け。
#}
{% macro collapsible_card(icon, title, is_open=False, icon_bg='bg-gray-100', description=None) %}
<section class="card">
    <details {% if is_open %}open{% endif %}>
        <summary class="cursor-pointer select-none px-4 py-3.5 md:px-6 md:py-4 flex items-center gap-2 font-display font-bold text-base md:text-lg text-gray-900">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-md {{ icon_bg }} text-base shrink-0">{{ icon }}</span>
            <span class="min-w-0">{{ title }}</span>
            <span class="ml-auto text-gray-400 chev shrink-0">▶</span>
        </summary>
        <div class="px-4 pb-4 md:px-6 md:pb-6">
            {% if description %}<p class="hint mb-4 mt-0">{{ description }}</p>{% endif %}
            {{ caller() }}
        </div>
    </details>
</section>
{% endmacro %}

{#
  一覧の行アクション用の小さいアイコンボタン。
  横並びで使うことを前提にしていて、ボタンが増えても折り返す(flex-wrap)ので崩れない。
  style: 'primary'(黒、最重要操作用) | 'default'(白地グレー枠、その他の操作用)
#}
{% macro icon_action(url, icon, label, style='default') %}
<a href="{{ url }}" title="{{ label }}" class="btn btn-sm {% if style == 'primary' %}btn-primary{% else %}btn-ghost{% endif %} gap-1 text-xs">
    <span aria-hidden="true">{{ icon }}</span><span>{{ label }}</span>
</a>
{% endmacro %}

{# データが空のときの案内(ただの「ありません」ではなく、次にすべき行動を示す) #}
{% macro empty_state(icon, message) %}
<div class="card border-dashed text-center text-gray-500 p-8">
    <div class="text-2xl mb-2">{{ icon }}</div>
    {{ message }}
</div>
{% endmacro %}

{# ダッシュボード上部などに置く小さい統計カード #}
{% macro stat_card(label, value, accent='text-gray-900') %}
<div class="card px-3 py-2.5 md:px-4 md:py-3">
    <div class="text-gray-400 text-xs truncate">{{ label }}</div>
    <div class="{{ accent }} font-mono tabular-nums font-bold text-lg md:text-xl">{{ value }}</div>
</div>
{% endmacro %}

{# ページ下部の戻り導線(全ページで同じ見た目・同じ位置になるようにマクロ化) #}
{% macro back_link(url, label) %}
<a href="{{ url }}" class="card flex items-center gap-2 hover:bg-gray-50 p-4 text-sm text-gray-700 transition">
    <span aria-hidden="true">←</span> <span class="text-blue-600 underline">{{ label }}</span>
</a>
{% endmacro %}

{# 設定1〜6の推測確率バー(一覧・詳細のどちらでも同じ見た目で使う) #}
{% macro setting_probabilities(probabilities) %}
{% if probabilities %}
<div class="flex flex-col gap-1">
    {% for setting_no, pct in probabilities | dictsort(by='value', reverse=true) %}
    <div class="flex items-center gap-2 text-xs">
        <span class="w-10 shrink-0 text-gray-400">設定{{ setting_no }}</span>
        <div class="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
            <div class="prob-bar bg-gray-900 h-2" style="width: {{ pct }}%;"></div>
        </div>
        <span class="w-9 shrink-0 text-right text-gray-600 font-mono tabular-nums">{{ pct }}%</span>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endmacro %}

{#
  判定スコアの内訳を表示する(カテゴリごとのバー + 合計点)。
  category_scores は record.category_scores(辞書)をそのまま渡す。
  スコアが無い(空辞書/未対応の古い記録)場合は何も表示しない。
#}
{% macro score_breakdown(category_scores) %}
{% set breakdown = describe_category_scores(category_scores) %}
{% if breakdown %}
{% set total, total_max = category_scores_total(category_scores) %}
<div>
    <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-semibold text-gray-500">📊 判定スコア内訳</span>
        <span class="text-xs font-mono tabular-nums font-bold px-2 py-0.5 rounded-full
            {% if total >= total_max * 0.6 %}bg-green-100 text-green-700
            {% elif total >= total_max * 0.35 %}bg-amber-100 text-amber-700
            {% else %}bg-gray-100 text-gray-500{% endif %}">
            {{ total }}/{{ total_max }}点
        </span>
    </div>
    <div class="flex flex-col gap-1">
        {% for b in breakdown %}
        <div class="flex items-center gap-2 text-xs">
            <span class="w-16 shrink-0 text-gray-400">{{ b.label }}</span>
            <div class="flex-1 bg-gray-100 rounded-full h-1.5 overflow-hidden">
                <div class="prob-bar bg-gray-900 h-1.5" style="width: {{ b.pct }}%;"></div>
            </div>
            <span class="w-10 shrink-0 text-right text-gray-500 font-mono tabular-nums">{{ b.score }}/{{ b.max_score }}</span>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
{% endmacro %}

{#
  記録1件のカード。
  以前はスマホ用カードとPC用テーブルで同じ内容を二重に書いていたため、
  片方だけ直して表示がズレる状態になっていた。1つのカードに統一し、
  画面幅に応じて段組(1列→2列)だけを変える。

  item: 記録データ1件 / item_chat: そのセッションのQ&A履歴
#}
{% macro record_card(item, item_chat=[]) %}
<article class="card p-4 flex flex-col gap-3">
    {# 1行目: いつ・どこで・何を打ったか #}
    <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
            <div class="text-xs text-gray-400 truncate font-mono">
                {{ item.date }}{% if item.store_name %} ・ {{ item.store_name }}{% endif %}
            </div>
            <div class="font-bold text-gray-900 truncate">
                {{ item.machine_name }}{% if item.machine_number %}<span class="text-gray-400 font-normal font-mono"> No.{{ item.machine_number }}</span>{% endif %}
            </div>
        </div>
        {% if item.setting_probabilities %}
        {% set best = (item.setting_probabilities | dictsort(by='value', reverse=true) | first) %}
        <div class="shrink-0 text-right">
            <div class="text-[10px] text-gray-400 leading-none">最有力</div>
            <div class="font-mono tabular-nums font-bold text-gray-900">設定{{ best[0] }}<span class="text-xs text-gray-400 ml-1">{{ best[1] }}%</span></div>
        </div>
        {% endif %}
    </div>

    {# 2行目: 主要な数値。実戦中にひと目で見たい情報なので大きめに並べる #}
    <div class="grid grid-cols-3 gap-2 text-center">
        <div class="panel py-2">
            <div class="text-[10px] text-gray-400">G数</div>
            <div class="font-mono tabular-nums font-bold text-gray-900">{{ item.total_games }}</div>
        </div>
        <div class="panel py-2">
            <div class="text-[10px] text-gray-400">差枚</div>
            <div class="font-mono tabular-nums font-bold {% if item.difference_slabs > 0 %}text-green-600{% elif item.difference_slabs < 0 %}text-red-600{% else %}text-gray-900{% endif %}">{{ item.difference_slabs }}</div>
            {% if item.max_difference_slabs and item.max_difference_slabs > item.difference_slabs %}
            <div class="text-[10px] text-gray-400 font-mono">最大{{ item.max_difference_slabs }}</div>
            {% endif %}
        </div>
        <div class="panel py-2">
            <div class="text-[10px] text-gray-400">BIG / REG</div>
            <div class="font-mono tabular-nums font-bold text-gray-900">{{ item.big_count }} / {{ item.reg_count }}</div>
        </div>
    </div>

    {% if item.graph_shape_tags %}
    <div class="flex flex-wrap gap-1">
        {% for tag in item.graph_shape_tags %}<span class="chip">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}

    {# 推測結果: このカードで一番読ませたい部分なので、枠で囲って独立させる #}
    <div class="panel bg-white border-gray-200">
        <div class="text-sm font-bold text-gray-900">{{ item.estimation.split('\n')[0] }}</div>
        {% if '\n' in item.estimation %}
        <div class="text-xs text-gray-400 font-mono mt-1">{{ item.estimation.split('\n')[1] }}</div>
        {% endif %}
        {% if item.setting_probabilities %}
        <div class="mt-2 pt-2 border-t border-gray-100">{{ setting_probabilities(item.setting_probabilities) }}</div>
        {% endif %}
        {% set breakdown_html = score_breakdown(item.category_scores) %}
        {% if breakdown_html | trim %}
        <div class="mt-2 pt-2 border-t border-gray-100">{{ breakdown_html }}</div>
        {% endif %}
    </div>

    {% if item.user_note or item.other_info %}
    <div class="text-sm">
        {% if item.user_note %}<div class="text-amber-700">{{ item.user_note }}</div>{% endif %}
        {% if item.other_info %}<div class="text-gray-400 text-xs mt-1">🤖 {{ item.other_info }}</div>{% endif %}
    </div>
    {% endif %}

    {# 行アクション: 今後ボタンが増えてもここに1行足すだけで済む #}
    <div class="flex flex-wrap gap-1.5 mt-auto pt-3 border-t border-gray-100">
        {{ icon_action(url_for('records.index', machine_name=item.machine_name, session_id=item.session_id), "📝", "追加分析", "primary") }}
        {{ icon_action(url_for('expected_value.index', machine_name=item.machine_name, session_id=item.session_id), "🧮", "期待値") }}
        {% if item.store_name and item.machine_number %}
        {{ icon_action(url_for('records.machine_chart', store_name=item.store_name, machine_number=item.machine_number, machine_name=item.machine_name), "📊", "グラフ") }}
        {% endif %}
        {% if item.store_name %}
        {{ icon_action(url_for('store_trends.index', store_name=item.store_name), "🏢", "店舗傾向") }}
        {% endif %}
    </div>

    <details class="border-t border-gray-100 pt-3">
        <summary class="cursor-pointer select-none text-xs text-blue-600 font-semibold">
            <span class="chev inline-block mr-1">▶</span>💬 AIに質問する{% if item_chat %} ({{ item_chat|length }}件){% endif %}
        </summary>
        <div class="mt-2 flex flex-col gap-2">
            {% for chat in item_chat[-2:] %}
            <div class="panel text-xs">
                <div class="text-blue-700 font-semibold">Q. {{ chat.question }}</div>
                <div class="text-gray-600 whitespace-pre-wrap mt-1">🤖 {{ chat.answer }}</div>
            </div>
            {% endfor %}
            <form action="{{ url_for('records.ask') }}" method="POST" class="flex gap-2">
                <input type="hidden" name="session_id" value="{{ item.session_id }}">
                <input type="hidden" name="machine_name" value="{{ item.machine_name }}">
                <input type="text" name="question" required placeholder="例: このまま打ち続けた方がいい?" class="input flex-1 text-sm">
                <button type="submit" class="btn btn-sm btn-primary">質問</button>
            </form>
        </div>
    </details>
</article>
{% endmacro %}

{#
  一覧のページネーション。
  endpoint: url_for に渡すエンドポイント名(例: 'records.index')
  page / total_pages: 現在ページと総ページ数
  extra_args: ページ番号以外に維持したいクエリパラメータの辞書(例: {'machine_name': '...'})
#}
{% macro pagination(endpoint, page, total_pages, extra_args={}) %}
{% if total_pages > 1 %}
<div class="flex items-center justify-center gap-2 text-sm">
    {% if page > 1 %}
    <a href="{{ url_for(endpoint, page=page-1, **extra_args) }}" class="btn btn-sm btn-ghost font-medium">← 前へ</a>
    {% else %}
    <span class="btn btn-sm bg-gray-100 text-gray-300 font-medium">← 前へ</span>
    {% endif %}
    <span class="px-3 py-1.5 text-gray-500 font-mono tabular-nums">{{ page }} / {{ total_pages }}</span>
    {% if page < total_pages %}
    <a href="{{ url_for(endpoint, page=page+1, **extra_args) }}" class="btn btn-sm btn-ghost font-medium">次へ →</a>
    {% else %}
    <span class="btn btn-sm bg-gray-100 text-gray-300 font-medium">次へ →</span>
    {% endif %}
</div>
{% endif %}
{% endmacro %}

{#
  店舗傾向の1行(区分ラベル + 平均差枚のバー + 件数)。
  バーは0を中央にした左右振り分けで、プラスは緑・マイナスは赤。
  max_abs は同じ表の中で一番大きい |平均差枚|(バーの幅を揃えるための基準)。
  件数が少ない区分は数字が偶然で振れるため、薄く表示して件数を必ず併記する。

  wide_label: 機種名など長い文字列がラベルになる表では true にする。
  固定幅の1列に収めて truncate すると文字が切れて読めなくなるため、
  ラベルをバーと同じ行に置かず、上段にフル幅で折り返し表示する2行レイアウトに切り替える。
#}
{% macro trend_row(row, max_abs, min_samples=3, wide_label=False) %}
{% set width = (row.avg_diff | abs / max_abs * 100) if max_abs else 0 %}
{% if wide_label %}
<div class="py-1.5 border-b border-gray-50 last:border-b-0 text-xs {% if not row.enough_samples %}opacity-60{% endif %}">
    <div class="text-gray-700 leading-snug break-words mb-1">{{ row.label }}</div>
    <div class="flex items-center gap-1.5 md:gap-2">
        <div class="flex-1 flex items-center min-w-[48px] md:min-w-[80px]">
            <div class="flex-1 flex justify-end">
                <div class="h-2.5 rounded-l-sm bg-red-500" style="width: {{ width if row.avg_diff < 0 else 0 }}%;"></div>
            </div>
            <div class="w-px h-3.5 bg-gray-300 shrink-0"></div>
            <div class="flex-1 flex justify-start">
                <div class="h-2.5 rounded-r-sm bg-green-600" style="width: {{ width if row.avg_diff > 0 else 0 }}%;"></div>
            </div>
        </div>
        <span class="w-14 md:w-16 shrink-0 text-right font-mono tabular-nums font-bold {% if row.avg_diff > 0 %}text-green-600{% elif row.avg_diff < 0 %}text-red-600{% else %}text-gray-500{% endif %}">
            {{ "%+d" | format(row.avg_diff | round(0) | int) }}
        </span>
        <span class="w-16 md:w-20 shrink-0 text-right text-gray-400 font-mono tabular-nums">
            {{ row.count }}件 {{ row.plus_rate | round(0) | int }}%
        </span>
    </div>
</div>
{% else %}
<div class="flex items-center gap-1.5 md:gap-2 py-1 text-xs {% if not row.enough_samples %}opacity-60{% endif %}">
    <span class="w-20 md:w-24 shrink-0 truncate text-gray-600" title="{{ row.label }}">{{ row.label }}</span>
    <div class="flex-1 flex items-center min-w-[48px] md:min-w-[80px]">
        <div class="flex-1 flex justify-end">
            <div class="h-2.5 rounded-l-sm bg-red-500" style="width: {{ width if row.avg_diff < 0 else 0 }}%;"></div>
        </div>
        <div class="w-px h-3.5 bg-gray-300 shrink-0"></div>
        <div class="flex-1 flex justify-start">
            <div class="h-2.5 rounded-r-sm bg-green-600" style="width: {{ width if row.avg_diff > 0 else 0 }}%;"></div>
        </div>
    </div>
    <span class="w-14 md:w-16 shrink-0 text-right font-mono tabular-nums font-bold {% if row.avg_diff > 0 %}text-green-600{% elif row.avg_diff < 0 %}text-red-600{% else %}text-gray-500{% endif %}">
        {{ "%+d" | format(row.avg_diff | round(0) | int) }}
    </span>
    <span class="w-16 md:w-20 shrink-0 text-right text-gray-400 font-mono tabular-nums">
        {{ row.count }}件 {{ row.plus_rate | round(0) | int }}%
    </span>
</div>
{% endif %}
{% endmacro %}

{#
  店舗傾向の1セクション(見出し + 説明 + 区分ごとの行)。
  rows は build_store_trends() が返す集計行のリスト。
  wide_label は trend_row にそのまま渡す(機種名など長いラベルの表で true にする)。
#}
{% macro trend_section(icon, title, description, rows, min_samples=3, scroll=False, wide_label=False) %}
<section class="card card-body">
    <h2 class="font-display font-bold text-base md:text-lg text-gray-900 flex flex-wrap items-center gap-x-2 gap-y-1">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-md bg-gray-100 text-base shrink-0">{{ icon }}</span>
        <span>{{ title }}</span>
        {% if rows %}<span class="text-xs text-gray-400 font-normal font-sans">{{ rows | length }}件</span>{% endif %}
    </h2>
    {% if description %}<p class="hint mt-2">{{ description }}</p>{% endif %}

    {% if rows %}
    {% set max_abs = rows | map(attribute='avg_diff') | map('abs') | max %}
    <div class="mt-3 {% if scroll %}max-h-96 overflow-y-auto pr-1{% endif %}">
        {% if not wide_label %}
        <div class="flex items-center gap-1.5 md:gap-2 pb-1 mb-1 border-b border-gray-100 text-[10px] text-gray-400">
            <span class="w-20 md:w-24 shrink-0">区分</span>
            <span class="flex-1 text-center min-w-[48px] md:min-w-[80px]">平均差枚</span>
            <span class="w-14 md:w-16 shrink-0 text-right">枚</span>
            <span class="w-16 md:w-20 shrink-0 text-right">件数/プラス</span>
        </div>
        {% endif %}
        {% for row in rows %}{{ trend_row(row, max_abs, min_samples, wide_label) }}{% endfor %}
    </div>
    <p class="hint">薄く表示している区分は{{ min_samples }}件未満で、偶然のブレの可能性が高いものです。</p>
    {% else %}
    <p class="text-sm text-gray-400 mt-3">この切り口で集計できる記録がありません。</p>
    {% endif %}
</section>
{% endmacro %}

{#
  取り込んだホールデータ(店の全台)の1行。
  主役は「平均G数=その日の稼働の高さ」で、全体平均に対する比率(全体比)が高い区分ほど
  イベント日の可能性が高い、という読み方をする。
  差枚・勝率はサイト側で空欄の日が多いため、有効日数を併記して過信させない。
#}
{% macro hall_metric_row(row, max_games) %}
{% set width = (row.avg_games / max_games * 100) if (max_games and row.avg_games) else 0 %}
<div class="flex items-center gap-1.5 md:gap-2 py-1 text-xs {% if not row.enough_samples %}opacity-60{% endif %}">
    <span class="w-16 md:w-24 shrink-0 truncate text-gray-600" title="{{ row.label }}">{{ row.label }}</span>
    <div class="hidden sm:block flex-1 min-w-[40px] bg-gray-100 rounded-full h-2 overflow-hidden">
        <div class="prob-bar h-2 {% if row.games_index and row.games_index >= 105 %}bg-green-600{% elif row.games_index and row.games_index < 95 %}bg-gray-300{% else %}bg-gray-900{% endif %}" style="width: {{ width }}%;"></div>
    </div>
    <span class="w-14 md:w-16 shrink-0 text-right font-mono tabular-nums text-gray-900">
        {{ (row.avg_games | round(0) | int ~ "G") if row.avg_games is not none else "—" }}
    </span>
    <span class="w-12 md:w-14 shrink-0 text-right font-mono tabular-nums font-bold
        {% if row.games_index and row.games_index >= 105 %}text-green-600{% elif row.games_index and row.games_index < 95 %}text-gray-400{% else %}text-gray-600{% endif %}">
        {{ (row.games_index | round(0) | int ~ "%") if row.games_index is not none else "—" }}
    </span>
    <span class="hidden md:inline-block w-20 shrink-0 text-right font-mono tabular-nums
        {% if row.avg_diff and row.avg_diff > 0 %}text-green-600{% elif row.avg_diff and row.avg_diff < 0 %}text-red-600{% else %}text-gray-400{% endif %}">
        {{ ("%+d" | format(row.avg_diff | round(0) | int) ~ "枚") if row.avg_diff is not none else "—" }}
    </span>
    <span class="w-10 md:w-12 shrink-0 text-right text-gray-400 font-mono tabular-nums">{{ row.count }}日</span>
</div>
{% endmacro %}

{# 取り込んだホールデータの1セクション(曜日別・日付末尾別など) #}
{% macro hall_metric_section(icon, title, description, rows, min_samples=3) %}
<section class="card card-body">
    <h2 class="font-display font-bold text-base md:text-lg text-gray-900 flex flex-wrap items-center gap-x-2 gap-y-1">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-md bg-gray-100 text-base shrink-0">{{ icon }}</span>
        <span>{{ title }}</span>
    </h2>
    {% if description %}<p class="hint mt-2">{{ description }}</p>{% endif %}

    {% if rows %}
    {% set games_values = rows | map(attribute='avg_games') | reject('none') | list %}
    {% set max_games = games_values | max if games_values else 0 %}
    <div class="mt-3">
        <div class="flex items-center gap-1.5 md:gap-2 pb-1 mb-1 border-b border-gray-100 text-[10px] text-gray-400">
            <span class="w-16 md:w-24 shrink-0">区分</span>
            <span class="hidden sm:block flex-1 min-w-[40px]">稼働</span>
            <span class="w-14 md:w-16 shrink-0 text-right">平均G数</span>
            <span class="w-12 md:w-14 shrink-0 text-right">全体比</span>
            <span class="hidden md:inline-block w-20 shrink-0 text-right">平均差枚</span>
            <span class="w-10 md:w-12 shrink-0 text-right">日数</span>
        </div>
        {% for row in rows %}{{ hall_metric_row(row, max_games) }}{% endfor %}
    </div>
    <p class="hint">全体比は、その区分の平均G数が店全体の平均と比べて何%かを表します（100%が平均）。薄い行は{{ min_samples }}日未満です。</p>
    {% else %}
    <p class="text-sm text-gray-400 mt-3">この切り口で集計できるデータがありません。</p>
    {% endif %}
</section>
{% endmacro %}
